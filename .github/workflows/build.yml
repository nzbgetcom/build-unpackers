name: build

on:
  workflow_dispatch:
    inputs: &inputs
      unpackers:
        required: false
        type: string
        default: "unrar 7zip"
      unrar-version:
        required: false
        type: string
        default: "7.23"
      unrar-src-version:
        required: false
        type: string
        default: "7.2.7"
      zip7-version:
        required: false
        type: string
        default: "26.03"
      platforms:
        required: false
        type: string
        default: "linux android freebsd windows macos"
      linux-archs:
        required: false
        type: string
        default: "armel armhf aarch64 i686 x86_64 riscv64 ppc6xx"
      android-archs:
        required: false
        type: string
        default: "i686-ndk x86_64-ndk armhf-ndk aarch64-ndk"
      freebsd-archs:
        required: false
        type: string
        default: "x86_64-bsd aarch64-bsd"
      musl-builder-version:
        required: false
        type: string
        default: "1.0"
      release-tag:
        required: false
        type: string
        default: ""
  workflow_call:
    inputs: *inputs

env:
  UNPACKERS: ${{ inputs.unpackers }}
  PLATFORMS: ${{ inputs.platforms }}
  LINUX_ARCHS: ${{ inputs.linux-archs }}
  ANDROID_ARCHS: ${{ inputs.android-archs }}
  FREEBSD_ARCHS: ${{ inputs.freebsd-archs }}
  UNRAR_VERSION: ${{ inputs.unrar-version }}
  UNRAR_SRC_VERSION: ${{ inputs.unrar-src-version }}
  ZIP7_VERSION: ${{ inputs.zip7-version }}
  MUSL_BUILDER_IMAGE: ghcr.io/nzbgetcom/nzbget-musl-builder
  MUSL_BUILDER_VERSION: ${{ inputs.musl-builder-version }}

jobs:

  matrix:
    runs-on: ubuntu-24.04
    outputs:
      cross: ${{ steps.generate.outputs.cross }}
      host: ${{ steps.generate.outputs.host }}

    steps:

      - name: Generate matrix
        id: generate
        run: |
          cross="[]"
          host="[]"
          for platform in $PLATFORMS; do
            case $platform in
              linux)
                for arch in $LINUX_ARCHS; do
                  image="${MUSL_BUILDER_IMAGE}:linux-${arch}-${MUSL_BUILDER_VERSION}"
                  cross=$(jq -c --arg platform "$platform" --arg arch "$arch" --arg image "$image" \
                    '. + [{"platform": $platform, "arch": $arch, "image": $image}]' <<< "$cross")
                done
                ;;
              android)
                image="${MUSL_BUILDER_IMAGE}:android-${MUSL_BUILDER_VERSION}"
                for arch in $ANDROID_ARCHS; do
                  cross=$(jq -c --arg platform "$platform" --arg arch "$arch" --arg image "$image" \
                    '. + [{"platform": $platform, "arch": $arch, "image": $image}]' <<< "$cross")
                done
                ;;
              freebsd)
                for arch in $FREEBSD_ARCHS; do
                  image="${MUSL_BUILDER_IMAGE}:freebsd-${arch%-bsd}-${MUSL_BUILDER_VERSION}"
                  cross=$(jq -c --arg platform "$platform" --arg arch "$arch" --arg image "$image" \
                    '. + [{"platform": $platform, "arch": $arch, "image": $image}]' <<< "$cross")
                done
                ;;
              windows|macos)
                host=$(jq -c --arg platform "$platform" \
                  '. + [{"platform": $platform}]' <<< "$host")
                ;;
              *)
                echo "Unknown platform: $platform" >&2
                exit 1
                ;;
            esac
          done
          echo "Cross matrix: $cross"
          echo "Host matrix: $host"
          echo "cross=$cross" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"

  build-cross:
    needs: matrix
    if: ${{ needs.matrix.outputs.cross != '[]' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.cross) }}

    env:
      PLATFORMS: ${{ matrix.platform }}
      LINUX_ARCHS: ${{ matrix.platform == 'linux' && matrix.arch || '' }}
      ANDROID_ARCHS: ${{ matrix.platform == 'android' && matrix.arch || '' }}
      FREEBSD_ARCHS: ${{ matrix.platform == 'freebsd' && matrix.arch || '' }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Build binaries
        run: ./build.sh

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/build.log
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: unpackers-${{ matrix.platform }}-${{ matrix.arch }}
          path: build

  build-host:
    needs: matrix
    if: ${{ needs.matrix.outputs.host != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.host) }}

    env:
      PLATFORMS: ${{ matrix.platform }}
      LINUX_ARCHS: ""
      ANDROID_ARCHS: ""
      FREEBSD_ARCHS: ""

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            tar \
            zip \
            unrar \
            p7zip-full \
            xz-utils \
            llvm-18

      - name: Download binaries
        run: ./build.sh

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.platform }}
          path: build/build.log
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: unpackers-${{ matrix.platform }}
          path: build

  collect:
    needs: [build-cross, build-host]
    if: >-
      ${{ always() && !cancelled() &&
          (needs.build-cross.result == 'success' || needs.build-cross.result == 'skipped') &&
          (needs.build-host.result == 'success' || needs.build-host.result == 'skipped') &&
          (needs.build-cross.result == 'success' || needs.build-host.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:

      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          pattern: unpackers-*
          path: unpackers
          merge-multiple: true

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: unpackers
          path: unpackers
          if-no-files-found: ignore

      - name: Delete per-platform artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of data.artifacts) {
              if (artifact.name.startsWith('unpackers-')) {
                console.log(`Deleting artifact ${artifact.name} (${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

  release:
    needs: collect
    if: ${{ inputs.release-tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:

      - name: Download combined artifact
        uses: actions/download-artifact@v7
        with:
          name: unpackers
          path: unpackers

      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release-tag }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets"
            gh release upload "$TAG" unpackers/* --repo "$REPO" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" unpackers/* --repo "$REPO" --title "$TAG" --notes "$TAG"
          fi
